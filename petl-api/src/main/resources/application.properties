spring.application.name=petl-api

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/petl
spring.datasource.username=petl
spring.datasource.password=${DB_PASSWORD:petl_dev}

# JPA: Flyway quản lý schema, Hibernate chỉ kiểm tra
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration